[workspace]
resolver = "2"
members = ["crates/core", "crates/proxy", "crates/bench"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/carbon-evolution/llm-firewall"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
