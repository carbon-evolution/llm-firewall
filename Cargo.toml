[workspace]
resolver = "2"
members = ["crates/core", "crates/proxy", "crates/bench", "crates/agent", "crates/agentfw"]
# cargo-fuzz harnesses: a separate nightly-only workspace with its own Cargo.lock.
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/carbon-evolution/llm-firewall"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
