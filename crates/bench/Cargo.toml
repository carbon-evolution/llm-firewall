[package]
name = "llm-firewall-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standardized head-to-head benchmark harness for the LLM Firewall."

[[bin]]
name = "llm-firewall-bench"
path = "src/main.rs"

[features]
# Enable the DeBERTa ML stage (Stage C) when benchmarking the full system.
# Requires the model asset under models/injection (scripts/fetch-model.sh).
ml = ["llm-firewall-core/ml"]

[dependencies]
llm-firewall-core = { path = "../core" }
serde = { workspace = true }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
