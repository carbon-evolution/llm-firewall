policies:
  - name: block-high-injection
    when: { detector: injection, min_severity: high }
    action: block
    message: "Blocked: possible prompt injection"
  - name: block-ml-injection
    # ML classifier positively identified injection (see injection detector's
    # ml_threshold, default 0.5). Blocks directly, independent of risk-score banding.
    when: { detector: injection.ml }
    action: block
    message: "Blocked: ML-detected prompt injection"
  - name: mask-pii
    when: { detector: pii }
    action: mask
  - name: block-secret-output
    when: { detector: secret, direction: output }
    action: block
    message: "Blocked: secret in model output"
  - name: block-dangerous-output
    # Improper Output Handling (LLM05): dangerous shell/HTML/JS or markdown exfiltration
    # in the model's reply.
    when: { detector: output, direction: output, min_severity: high }
    action: block
    message: "Blocked: dangerous content in model output"
  - name: block-high-risk
    when: { risk_score_gte: 85 }
    action: block
default: allow
