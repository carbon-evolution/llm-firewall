bind: "0.0.0.0:8080"
upstream:
  openai_base: "https://api.openai.com"
policy_file: "policies/default.yaml"
fail_mode: fail_closed
# Streaming: reassembled reply text held back until scanned in context (bytes; floor 64).
stream_holdback_bytes: 256
# ML prompt-injection classifier (only in builds with `--features ml`; ignored otherwise).
# Fail-closed: an `ml` build refuses to start if the model can't load, unless `optional: true`.
injection:
  ml:
    model_dir: "models/injection"   # ./scripts/fetch-model.sh injection
    threshold: 0.5
    optional: false
